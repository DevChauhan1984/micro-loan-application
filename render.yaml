services:
  - type: web
    name: microloan-manager
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    disk:
      name: microloan-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_PATH
        value: /var/data/microloan.db
